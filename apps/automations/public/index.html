<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXCODE Automations</title><style>
:root{color-scheme:dark;--bg:#080d0a;--panel:#101a14;--line:#263c2e;--green:#39e58c;--lime:#c4f45b;--muted:#8ba394}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#14251a,var(--bg) 60%);font:14px system-ui;color:#e6f4eb}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#0a110d}.brand{font-weight:900;letter-spacing:3px;color:var(--green)}main{display:grid;grid-template-columns:220px 1fr 270px;height:calc(100vh - 68px)}aside{background:#0b120e;padding:16px;border-right:1px solid var(--line)}.inspector{border:0;border-left:1px solid var(--line)}h3{font-size:11px;color:var(--muted);letter-spacing:1px}.palette button,.actions button{display:block;width:100%;text-align:left;margin:8px 0;padding:10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:#e6f4eb;cursor:pointer}.palette button:hover,.actions button:hover{border-color:var(--green)}.canvas{overflow:auto;background-image:radial-gradient(#284232 1px,transparent 1px);background-size:22px 22px}.board{position:relative;min-width:900px;min-height:650px;width:100%;height:100%}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;width:180px;min-height:82px;background:#101c14;border:1px solid #345541;border-radius:12px;padding:12px;cursor:grab}.node.selected{border-color:var(--lime)}.node strong{display:block;color:var(--green);margin-bottom:8px}.node small,.muted{color:var(--muted)}.port{position:absolute;right:-6px;top:35px;width:12px;height:12px;border-radius:50%;background:var(--lime)}.field{width:100%;background:#0c140f;border:1px solid var(--line);border-radius:7px;color:#e6f4eb;padding:9px;margin:6px 0 12px}.log{white-space:pre-wrap;overflow:auto;max-height:180px;font:11px monospace;color:var(--lime)}@media(max-width:850px){main{grid-template-columns:160px 1fr}.inspector{display:none}}
</style></head><body><header class="top"><div class="brand">NEXCODE / AUTOMATIONS</div><div id="status">● Conectando</div></header><main><aside><h3>BIBLIOTECA DE NÓS</h3><div class="palette" id="palette"></div><p class="muted">Clique para adicionar. Arraste para organizar. Clique na porta verde de um nó e depois em outro para conectar.</p><div class="actions"><button id="save">Salvar workflow</button><button id="run">Executar workflow</button><button id="clear">Limpar canvas</button></div><h3>EXECUÇÃO</h3><div class="log" id="log">Aguardando…</div></aside><section class="canvas"><div class="board" id="board"><svg id="edges"></svg></div></section><aside class="inspector"><h3>INSPECTOR</h3><label>Nome<input id="name" class="field" value="Minha automação"></label><label>API token<input id="token" class="field" type="password" placeholder="NEXCODE_AUTOMATIONS_TOKEN"></label><div id="details" class="muted">Selecione um nó para editar.</div><p class="muted">Editor visual inicial. Alguns tipos de nó ainda estão planejados.</p></aside></main><script>
const types=[["trigger","Trigger"],["http","HTTP Request"],["condition","Condition"],["transform","Transform"],["ai","AI Agent (planejado)"],["code","Code (sandbox pendente)"],["delay","Delay"]],palette=document.querySelector("#palette"),board=document.querySelector("#board"),svg=document.querySelector("#edges"),details=document.querySelector("#details"),log=document.querySelector("#log");let nodes=[],edges=[],selected=null,linkFrom=null,workflowId=null,drag=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
types.forEach(([id,label])=>{let b=document.createElement("button");b.textContent=label;b.onclick=()=>add(id);palette.append(b)});
function add(kind){let t=types.find(x=>x[0]===kind),n={id:crypto.randomUUID(),kind,name:t[1],config:{},x:60+nodes.length%3*240,y:70+Math.floor(nodes.length/3)*140};nodes.push(n);select(n.id);render()}
function select(id){selected=id;let n=nodes.find(x=>x.id===id);if(!n){details.textContent="Selecione um nó.";return}details.innerHTML="<b>"+esc(n.name)+"</b><p>"+esc(n.kind)+"</p><label>Nome<input class=field id=nodeName value='"+esc(n.name)+"'></label><label>Configuração JSON<textarea class=field id=nodeConfig rows=8>"+esc(JSON.stringify(n.config,null,2))+"</textarea></label><button class=field id=apply>Aplicar</button><button class=field id=remove>Remover</button>";document.querySelector("#apply").onclick=()=>{try{n.name=document.querySelector("#nodeName").value;n.config=JSON.parse(document.querySelector("#nodeConfig").value);render()}catch(e){alert("JSON inválido: "+e.message)}};document.querySelector("#remove").onclick=()=>{nodes=nodes.filter(x=>x.id!==id);edges=edges.filter(e=>e.source!==id&&e.target!==id);selected=null;select(null);render()}}
function render(){board.querySelectorAll(".node").forEach(x=>x.remove());for(const n of nodes){let el=document.createElement("div");el.className="node"+(n.id===selected?" selected":"");el.style.left=n.x+"px";el.style.top=n.y+"px";el.innerHTML="<strong>"+esc(n.name)+"</strong><small>"+esc(n.kind)+"</small><span class=port></span>";el.onclick=e=>{if(e.target.classList.contains("port")){if(linkFrom&&linkFrom!==n.id){edges.push({id:crypto.randomUUID(),source:linkFrom,target:n.id});linkFrom=null;render()}else linkFrom=n.id;return}select(n.id);render()};el.onpointerdown=e=>{if(e.target.classList.contains("port"))return;drag={id:n.id,x:e.clientX,y:e.clientY,ox:n.x,oy:n.y};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!drag||drag.id!==n.id)return;n.x=drag.ox+e.clientX-drag.x;n.y=drag.oy+e.clientY-drag.y;el.style.left=n.x+"px";el.style.top=n.y+"px";drawEdges()};el.onpointerup=()=>drag=null;board.append(el)}drawEdges()}
function drawEdges(){svg.innerHTML="";for(const e of edges){let a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);if(!a||!b)continue;let p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d","M"+(a.x+180)+" "+(a.y+42)+" C"+(a.x+240)+" "+(a.y+42)+","+(b.x-60)+" "+(b.y+42)+","+b.x+" "+(b.y+42));p.setAttribute("stroke","#39e58c");p.setAttribute("stroke-width","2");p.setAttribute("fill","none");svg.append(p)}}
function headers(){return {"content-type":"application/json","authorization":"Bearer "+document.querySelector("#token").value}}
async function api(path,body){let r=await fetch(path,{method:body?"POST":"GET",headers:headers(),body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
document.querySelector("#save").onclick=async()=>{try{let d=await api("/api/workflows",{id:workflowId||crypto.randomUUID(),name:document.querySelector("#name").value,version:1,enabled:true,nodes:nodes.map(({x,y,...n})=>n),edges});workflowId=d.workflow.id;log.textContent="Workflow salvo: "+workflowId}catch(e){log.textContent=e.message}};
document.querySelector("#run").onclick=async()=>{try{if(!workflowId)throw Error("Salve o workflow primeiro.");let d=await api("/api/workflows/"+workflowId+"/run",{input:{startedAt:new Date().toISOString()}});log.textContent=JSON.stringify(d,null,2)}catch(e){log.textContent=e.message}};
document.querySelector("#clear").onclick=()=>{nodes=[];edges=[];workflowId=null;select(null);render()};
fetch("/health").then(r=>r.json()).then(d=>document.querySelector("#status").textContent=d.enabled?"● Runtime online":"● Runtime pausado").catch(()=>document.querySelector("#status").textContent="● Runtime indisponível");
</script></body></html>
