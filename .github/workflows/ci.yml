name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Workspace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Persist generated PNPM lockfile on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -f pnpm-lock.yaml ] && ! git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add PNPM lockfile"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Validate workspace package graph
        run: pnpm --recursive list --depth -1
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
