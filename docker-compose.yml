services:
  nexcode-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: nexcode-web:local
    container_name: nexcode-web
    restart: unless-stopped
    init: true
    ports:
      - "${NEXCODE_WEB_BIND:-127.0.0.1}:4173:4173"
    environment:
      NODE_ENV: production
      NEXCODE_HOST: 0.0.0.0
      NEXCODE_PORT: 4173
      NEXCODE_WORKSPACE: /workspace
    volumes:
      - nexcode_web_data:/root/.nexcode
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok||r.status===404?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  nexcode-automations:
    build:
      context: .
      dockerfile: docker/automations.Dockerfile
    image: nexcode-automations:local
    container_name: nexcode-automations
    restart: unless-stopped
    init: true
    ports:
      - "${NEXCODE_AUTOMATIONS_BIND:-127.0.0.1}:4280:4280"
    environment:
      NODE_ENV: production
      NEXCODE_AUTOMATIONS_PORT: 4280
      NEXCODE_AUTOMATIONS_TOKEN: ${NEXCODE_AUTOMATIONS_TOKEN:?Set NEXCODE_AUTOMATIONS_TOKEN in .env}
    volumes:
      - nexcode_automation_data:/app/data
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4280/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  nexcode_web_data:
  nexcode_automation_data:
