services:
  nexcode-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: nexcode-web:local
    container_name: nexcode-web
    restart: unless-stopped
    init: true
    ports:
      - "${NEXCODE_WEB_BIND:-127.0.0.1}:4173:4173"
    environment:
      NODE_ENV: production
      NEXCODE_HOST: 0.0.0.0
      NEXCODE_PORT: 4173
      NEXCODE_WORKSPACE: /workspace
    volumes:
      - nexcode_web_data:/home/node/.nexcode
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nexcode_web_data:
